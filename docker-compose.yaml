version: "3.9"

services:
  mcpproxy:
    image: mcpzerotrust/proxy:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    # Multi-arch notes: For native multi-arch builds, use:
    #   docker buildx build --platform linux/amd64,linux/arm64 -t mcpzerotrust/proxy:latest --push .
    ports:
      - "8080:8080"
    volumes:
      # Mount your config file here:
      # - ./config.yaml:/etc/mcpproxy/config.yaml:ro
      - ./configs/example.yaml:/etc/mcpproxy/config.yaml:ro
    environment:
      # Pass OAuth client secret from host environment
      - MCP_PROXY_CLIENT_SECRET=${MCP_PROXY_CLIENT_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M

  # Example: Add your MCP server as a container and proxy to it:
  #
  # my-mcp-server:
  #   image: your-mcp-server:latest
  #   expose:
  #     - "3000"
  #
  # Then set upstream_url in config.yaml to: http://my-mcp-server:3000
