name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test with race detector
        run: go test -race ./...

  release-docker:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          docker build \
            --build-arg VERSION="${RELEASE_TAG}" \
            -t "ghcr.io/anoblescm/mcp-zero-trust-proxy:${RELEASE_TAG}" \
            -t "ghcr.io/anoblescm/mcp-zero-trust-proxy:latest" \
            .
          docker push "ghcr.io/anoblescm/mcp-zero-trust-proxy:${RELEASE_TAG}"
          docker push "ghcr.io/anoblescm/mcp-zero-trust-proxy:latest"

  release-binary:
    name: Build and publish release binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Extract tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          mkdir -p dist

          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
            -o dist/mcpproxy-linux-amd64 ./cmd/mcpproxy

          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
            -o dist/mcpproxy-linux-arm64 ./cmd/mcpproxy

          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
            -o dist/mcpproxy-darwin-amd64 ./cmd/mcpproxy

          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
            -o dist/mcpproxy-darwin-arm64 ./cmd/mcpproxy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "MCP Zero-Trust Proxy ${{ steps.tag.outputs.TAG }}"
          body: |
            ## MCP Zero-Trust Proxy ${{ steps.tag.outputs.TAG }}

            Drop-in authentication proxy for MCP servers. OAuth 2.1 PKCE, tool-level RBAC, session isolation, rate limiting, and audit logging — zero code changes to your server.

            ### Quick start

            ```bash
            docker pull ghcr.io/anoblescm/mcp-zero-trust-proxy:${{ steps.tag.outputs.TAG }}
            docker run -e MCP_TARGET=localhost:3000 ghcr.io/anoblescm/mcp-zero-trust-proxy:${{ steps.tag.outputs.TAG }}
            ```

            See [QUICKSTART.md](https://github.com/keith-aykira/mcp-zero-trust-proxy/blob/main/docs/QUICKSTART.md) for full setup instructions.

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | amd64 | mcpproxy-linux-amd64 |
            | Linux | arm64 | mcpproxy-linux-arm64 |
            | macOS | amd64 (Intel) | mcpproxy-darwin-amd64 |
            | macOS | arm64 (Apple Silicon) | mcpproxy-darwin-arm64 |

            ### License

            MIT — free and open-source. No license key required.
          files: dist/*
          draft: false
          prerelease: false
