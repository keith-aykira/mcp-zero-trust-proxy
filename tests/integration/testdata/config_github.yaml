# GitHub OAuth config for integration tests.
# Auth is injected via testAuthenticator in test code — this YAML
# documents the fields an operator would configure.
server:
  upstream_url: "http://localhost:9999"
  listen_addr: ":0"

auth:
  provider: "github"
  client_id: "test-github-client-id"
  client_secret: "${GITHUB_CLIENT_SECRET}"
  redirect_url: "http://localhost:8080/auth/callback"

roles:
  - name: "admin"
    allowed_tools: []
  - name: "readonly"
    allowed_tools: []
  - name: "restricted"
    allowed_tools: ["read_file", "list_dir"]

rate_limit:
  requests_per_minute: 100
  burst_size: 10

audit:
  enabled: false  # suppress output in tests

logging:
  level: "error"
  format: "json"
